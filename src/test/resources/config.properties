# Default test configuration. Any key here can be overridden per-run without
# editing this file, e.g.:
#   mvn test -Ddevice.name="iPhone 15" -Dplatform.version=17
#
# BrowserStack credentials are NOT here - ConfigReader reads them only from
# the BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY environment variables.
bstack.hub.url=https://hub-cloud.browserstack.com/wd/hub
bstack.build.name=lawclerk-mobile-local

device.name=iPhone 14
platform.version=17
timeout.ms=30000

# HA (Hiring Attorney) app. Fill in once mobile dev supplies the build/bundle
# ID and the .ipa has been uploaded to BrowserStack for an app_url (LAW-881).
app.ha.bundleId=
app.ha.url=
test.ha.user.email=qa.ha.user@example.com
test.ha.user.password=ChangeMe123!

# RA (Remote Associate) app.
app.ra.bundleId=
app.ra.url=
test.ra.user.email=qa.ra.user@example.com
test.ra.user.password=ChangeMe123!
